  <div class="container">
    <div class="todo-container">
      <div class="todo-list-section">
        <h2>To-do list</h2>
        <div id="taskList"></div>
      </div>

      <div class="todo-form-section">
        <h2>Add new task</h2>
        <label>* Title</label>
        <input type="text" id="taskTitle" placeholder="Title">

        <label>* Description</label>
        <textarea id="taskDesc" rows="4" placeholder="Description"></textarea>

        <button id="addTaskBtn" style="width: 100%; padding: 12px; background-color: #b846e5;">Add task</button>
      </div>
    </div>
  </div>

  <script src="js/todo.js"></script>
</body>
