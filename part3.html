  <div class="container">
    <h2>Part 3: Events</h2>

    <div class="section-box">
      <h3>Task 5: Mouse Events</h3>
      <div id="colorBox">Hover over me!</div>
    </div>

    <div class="section-box">
      <h3>Task 6: Keyboard Events</h3>
      <input type="text" id="keyupInput" placeholder="Type something here...">
      <p>Live output: <span id="keyupOutput" style="font-weight: bold;"></span></p>
    </div>

    <div class="section-box">
      <h3>Task 7: Calculator</h3>
      <input type="number" id="calcNum1" placeholder="First number" style="width: 48%; display: inline-block;">
      <input type="number" id="calcNum2" placeholder="Second number" style="width: 48%; display: inline-block;">
      <div>
        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">-</button>
        <button onclick="calculate('*')">*</button>
        <button onclick="calculate('/')">/</button>
      </div>
      <h4>Result: <span id="calcResult">0</span></h4>
    </div>
  </div>

  <script src="js/part3.js"></script>
